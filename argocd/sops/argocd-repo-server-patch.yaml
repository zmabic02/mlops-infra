spec:
  template:
    spec:
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age
      initContainers:
        - name: install-ksops
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              apk add --no-cache curl tar

              tmp_dir="$(mktemp -d)"
              cd "$tmp_dir"

              curl -fsSLO https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.2.1/kustomize_v5.2.1_linux_amd64.tar.gz
              tar -xzf kustomize_v5.2.1_linux_amd64.tar.gz

              curl -fsSLO https://github.com/viaduct-ai/kustomize-sops/releases/latest/download/ksops_latest_Linux_x86_64.tar.gz
              tar -xzf ksops_latest_Linux_x86_64.tar.gz

              install -m 0755 kustomize /custom-tools/kustomize_5_2_1
              install -m 0755 ksops /custom-tools/ksops
          volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools
      containers:
        - name: argocd-repo-server
          env:
            - name: XDG_CONFIG_HOME
              value: /.config
            - name: SOPS_AGE_KEY_FILE
              value: /.config/sops/age/keys.txt
          volumeMounts:
            - mountPath: /usr/local/bin/kustomize
              $patch: delete
            - mountPath: /usr/local/bin/ksops
              name: custom-tools
              subPath: ksops
            - mountPath: /.config/sops/age
              name: sops-age
