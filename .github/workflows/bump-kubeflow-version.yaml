name: Bump Kubeflow Version

on:
  push:
    paths:
      - 'kubeflow/upstream-version.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kubeflow-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat kubeflow/upstream-version.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update Kubeflow ?ref= occurrences
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating to version: $VERSION"

          find kubeflow -type f -name "kustomization.yaml" -print0 | while IFS= read -r -d '' file; do
            sed -i -E "s/\?ref=[^\"']+/\?ref=${VERSION}/g" "$file"
          done

      - name: Verify Kubeflow build
        run: |
          kustomize build kubeflow/overlays/k3s >/dev/null

      - name: Verify ArgoCD manifests
        run: |
          kustomize build argocd/applications >/dev/null

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "chore: bump kubeflow version to ${{ steps.version.outputs.version }}"
          git push