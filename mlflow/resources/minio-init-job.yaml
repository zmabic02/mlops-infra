apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: mlflow
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for MinIO..."
              until mc alias set myminio http://minio:9000 $ROOT_USER $ROOT_PASSWORD; do
                sleep 2;
              done;

              echo "Creating bucket..."
              mc mb myminio/mlflow-bucket || true;

              echo "Creating policy..."
              cat <<EOF > /tmp/policy.json
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Action": [
                      "s3:GetBucketLocation",
                      "s3:ListBucket"
                    ],
                    "Effect": "Allow",
                    "Resource": "arn:aws:s3:::mlflow-bucket"
                  },
                  {
                    "Action": [
                      "s3:PutObject",
                      "s3:GetObject",
                      "s3:DeleteObject"
                    ],
                    "Effect": "Allow",
                    "Resource": "arn:aws:s3:::mlflow-bucket/*"
                  }
                ]
              }
              EOF

              mc admin policy create myminio mlflow-policy /tmp/policy.json || true;

              echo "Creating user..."
              mc admin user add myminio $MLFLOW_USER $MLFLOW_PASSWORD || true;

              echo "Attaching policy..."
              mc admin policy attach myminio mlflow-policy --user $MLFLOW_USER || true;

              echo "Done."
          env:
            - name: ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: MINIO_ACCESS_KEY
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: MINIO_SECRET_KEY
            - name: MLFLOW_USER
              valueFrom:
                secretKeyRef:
                  name: mlflow-artifact-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: MLFLOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-artifact-credentials
                  key: AWS_SECRET_ACCESS_KEY
