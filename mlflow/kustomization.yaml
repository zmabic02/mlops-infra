apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generators:
  - resources/secret-generator.yaml

resources:
  - resources/postgres-pvc.yaml
  - resources/postgres-deployment.yaml
  - resources/postgres-service.yaml
  - resources/minio-pvc.yaml
  - resources/minio-deployment.yaml
  - resources/minio-service.yaml
  - resources/minio-init-job.yaml
  - resources/mlflow-serviceaccount.yaml
  - resources/mlflow-service.yaml
  - resources/mlflow-deployment.yaml
  - resources/mlflow-virtualservice.yaml
  - resources/minio-gateway.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/part-of: mlflow
