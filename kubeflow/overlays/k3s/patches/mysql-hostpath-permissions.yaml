apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: kubeflow
spec:
  template:
    spec:
      initContainers:
        - name: prepare-mysql-volume
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - mkdir -p /var/lib/mysql && chown -R 999:999 /var/lib/mysql
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
