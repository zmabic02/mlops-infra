apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: kubeflow
spec:
  template:
    spec:
      initContainers:
        - name: prepare-seaweedfs-volume
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - mkdir -p /data && chown -R 1000:1000 /data
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data