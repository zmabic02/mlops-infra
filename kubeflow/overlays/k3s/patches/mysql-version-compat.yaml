apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: kubeflow
spec:
  template:
    spec:
      containers:
        - name: mysql
          image: gcr.io/ml-pipeline/mysql:8.0.26
          args:
            - --datadir
            - /var/lib/mysql
            - --default-authentication-plugin=mysql_native_password
            - --disable-log-bin