apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

sortOptions:
  order: legacy
  legacySortOptions:
    orderFirst:
      - Namespace
      - ResourceQuota
      - StorageClass
      - CustomResourceDefinition
      - MutatingWebhookConfiguration
      - ServiceAccount
      - PodSecurityPolicy
      - NetworkPolicy
      - Role
      - ClusterRole
      - RoleBinding
      - ClusterRoleBinding
      - ConfigMap
      - Secret
      - Endpoints
      - Service
      - LimitRange
      - PriorityClass
      - PersistentVolume
      - PersistentVolumeClaim
      - Deployment
      - StatefulSet
      - CronJob
      - PodDisruptionBudget
    orderLast:
      - ValidatingWebhookConfiguration

resources:
  - https://github.com/kubeflow/manifests.git//common/cert-manager/overlays/kubeflow?ref=26.03
  - https://github.com/kubeflow/manifests.git//common/istio/istio-crds/base?ref=26.03
  - https://github.com/kubeflow/manifests.git//common/istio/istio-namespace/base?ref=26.03
  - https://github.com/kubeflow/manifests.git//common/istio/istio-install/overlays/oauth2-proxy?ref=26.03
  - https://github.com/kubeflow/manifests.git//common/oauth2-proxy/overlays/m2m-dex-only?ref=26.03
  - https://github.com/kubeflow/manifests.git//common/dex/overlays/oauth2-proxy?ref=26.03
  - https://github.com/kubeflow/manifests.git//common/kubeflow-namespace/base?ref=26.03
  - https://github.com/kubeflow/manifests.git//common/kubeflow-roles/base?ref=26.03
  - https://github.com/kubeflow/manifests.git//common/istio/kubeflow-istio-resources/base?ref=26.03
  - https://github.com/kubeflow/manifests.git//applications/pipeline/overlays?ref=26.03
  - https://github.com/kubeflow/manifests.git//applications/centraldashboard/upstream/overlays/istio?ref=26.03
  - https://github.com/kubeflow/manifests.git//applications/admission-webhook/upstream/overlays/cert-manager?ref=26.03
  - https://github.com/kubeflow/manifests.git//applications/jupyter/jupyter-web-app/upstream/overlays/istio?ref=26.03
  - https://github.com/kubeflow/manifests.git//applications/jupyter/notebook-controller/upstream/overlays/kubeflow?ref=26.03
  - https://github.com/kubeflow/manifests.git//applications/profiles/pss?ref=26.03
  - https://github.com/kubeflow/manifests.git//applications/pvcviewer-controller/upstream/base?ref=26.03
  - https://github.com/kubeflow/manifests.git//applications/volumes-web-app/upstream/overlays/istio?ref=26.03
  - https://github.com/kubeflow/manifests.git//common/user-namespace/base?ref=26.03
  - patches/default-user-rbac.yaml
  - ../../components/dashboard

patches:
  - path: patches/istiod-disable-cni.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: istiod
      namespace: istio-system
  - path: patches/istio-sidecar-injector-no-cni.yaml
    target:
      version: v1
      kind: ConfigMap
      name: istio-sidecar-injector
      namespace: istio-system
  - path: patches/delete.istio-cni-node.yaml
    target:
      group: apps
      version: v1
      kind: DaemonSet
      name: istio-cni-node
      namespace: kube-system
  - path: patches/namespace.kubeflow-pss.yaml
    target:
      version: v1
      kind: Namespace
      name: kubeflow
  - path: patches/namespace.kubeflow-user-example-com-pss.yaml
    target:
      version: v1
      kind: Namespace
      name: kubeflow-user-example-com
  - path: patches/namespace.oauth2-proxy-pss.yaml
    target:
      version: v1
      kind: Namespace
      name: oauth2-proxy
  - path: patches/namespace.auth-pss.yaml
    target:
      version: v1
      kind: Namespace
      name: auth
  - path: patches/delete.networkpolicy.spark-operator-webhook.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: spark-operator-webhook
      namespace: kubeflow
  - path: patches/delete.networkpolicy.tensorboards-web-app.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: tensorboards-web-app
      namespace: kubeflow
  - path: patches/metadata-grpc-probes.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: metadata-grpc-deployment
      namespace: kubeflow
  - path: patches/ml-pipeline-probes.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: ml-pipeline
      namespace: kubeflow
  - path: patches/ml-pipeline-ui-destinationrule.yaml
    target:
      group: networking.istio.io
      version: v1alpha3
      kind: DestinationRule
      name: ml-pipeline-ui
      namespace: kubeflow
  - path: patches/jupyter-web-app-destinationrule.yaml
    target:
      group: networking.istio.io
      version: v1alpha3
      kind: DestinationRule
      name: jupyter-web-app
      namespace: kubeflow
  - path: patches/ml-pipeline-mysql-destinationrule.yaml
    target:
      group: networking.istio.io
      version: v1alpha3
      kind: DestinationRule
      name: ml-pipeline-mysql
      namespace: kubeflow
  - path: patches/mysql-hostpath-permissions.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: mysql
      namespace: kubeflow
  - path: patches/mysql-version-compat.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: mysql
      namespace: kubeflow
  - path: patches/seaweedfs-hostpath-permissions.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: seaweedfs
      namespace: kubeflow

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: kubeflow-script
      app.kubernetes.io/part-of: kubeflow
