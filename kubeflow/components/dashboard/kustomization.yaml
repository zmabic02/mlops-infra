apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

patches:
  - path: patches/centraldashboard-config.yaml
    target:
      kind: ConfigMap
      name: centraldashboard-config
      namespace: kubeflow
  - path: patches/centraldashboard-logout-url.yaml
    target:
      kind: Deployment
      name: centraldashboard
      namespace: kubeflow
