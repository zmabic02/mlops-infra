apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/kubeflow/manifests.git//apps/pipeline/upstream/third-party/argo/upstream/manifests/base/crds?ref=v1.10.0
  - https://github.com/kubeflow/manifests.git//apps/pipeline/upstream/third-party/argo/upstream/manifests/cluster-install/workflow-controller-rbac?ref=v1.10.0
  - https://github.com/kubeflow/manifests.git//apps/pipeline/upstream/third-party/argo/base?ref=v1.10.0

patches:
  - path: patches/workflow-controller-clusterrolebinding-namespace.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: argo-binding