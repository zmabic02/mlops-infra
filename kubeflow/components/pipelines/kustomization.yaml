apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubeflow

resources:
  - https://github.com/kubeflow/manifests.git//apps/pipeline/upstream/third-party/metacontroller/base?ref=v1.10.0
  - https://github.com/kubeflow/manifests.git//apps/pipeline/upstream/base/installs/multi-user?ref=v1.10.0
  - https://github.com/kubeflow/manifests.git//apps/pipeline/upstream/base/metadata/base?ref=v1.10.0
  - https://github.com/kubeflow/manifests.git//apps/pipeline/upstream/base/metadata/options/istio?ref=v1.10.0
  - ./resources/argo-cluster
  - https://github.com/kubeflow/manifests.git//apps/pipeline/upstream/third-party/mysql/base?ref=v1.10.0
  - https://github.com/kubeflow/manifests.git//apps/pipeline/upstream/third-party/mysql/options/istio?ref=v1.10.0
  - https://github.com/kubeflow/manifests.git//apps/pipeline/upstream/third-party/minio/base?ref=v1.10.0
  - https://github.com/kubeflow/manifests.git//apps/pipeline/upstream/third-party/minio/options/istio?ref=v1.10.0
  - https://github.com/kubeflow/manifests.git//apps/pipeline/upstream/env/cert-manager/base?ref=v1.10.0

images:
  - name: gcr.io/ml-pipeline/minio
    newName: minio/minio
    newTag: RELEASE.2022-10-29T06-21-33Z

labels:
  - includeSelectors: true
    pairs:
      application-crd-id: kubeflow-pipelines

patches:
  - path: patches/delete.clusterrole.cache-deployer.yaml
  - path: patches/delete.crb.cache-deployer.yaml
  - path: patches/delete.deployment.cache-deployer.yaml
  - path: patches/delete.role.cache-deployer.yaml
  - path: patches/delete.rolebinding.cache-deployer.yaml
  - path: patches/delete.sa.cache-deployer.yaml
  - path: patches/mysql-deployment.yaml
  - path: patches/mysql-secret.yaml
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --tls_cert_filename=tls.crt
    target:
      kind: Deployment
      name: cache-server
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --tls_key_filename=tls.key
    target:
      kind: Deployment
      name: cache-server
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: quay.io/argoproj/argoexec:v3.4.17
    target:
      kind: Deployment
      name: workflow-controller